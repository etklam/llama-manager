name: test-and-package

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: python -m pytest -q
          - os: macos-14
            command: python -m pytest -q
          - os: ubuntu-24.04
            command: xvfb-run -a python -m pytest -q
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk and Xvfb on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: ${{ matrix.command }}

  package:
    needs: test
    strategy:
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build onedir bundle
        run: python packaging/build.py --zip
